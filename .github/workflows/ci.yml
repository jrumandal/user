name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user
        uses: actions/checkout@v4
        with:
          repository: jrumandal/user
          path: user

      - name: Checkout shared (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shared
          path: shared

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link sibling into a workspace
        run: |
          printf 'packages:\n  - "user"\n  - "shared/packages/*"\n' > pnpm-workspace.yaml
          printf '{\n  "name": "mf-workspace",\n  "private": true\n}\n' > package.json

      - name: Install
        run: pnpm install

      - name: Lint
        working-directory: user
        run: pnpm lint

      - name: Typecheck
        working-directory: user
        run: pnpm typecheck

      - name: Test
        working-directory: user
        run: pnpm test

      - name: Build
        working-directory: user
        run: pnpm build
