name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user
        uses: actions/checkout@v4
        with:
          repository: jrumandal/user
          path: user

      # The user MF depends on the @jrumandal/* packages. For a self-contained CI
      # (no registry required), check out the shared repo as a sibling and wire
      # up a pnpm workspace so `workspace:*` resolves locally.
      - name: Checkout shared (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/shared
          path: shared

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create workspace root
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - shared/packages/*
            - user
          allowBuilds:
            '@apollo/protobufjs': true
            '@nestjs/core': true
            '@parcel/watcher': true
            '@prisma/client': true
            '@prisma/engines': true
            '@scarf/scarf': true
            esbuild: true
            lmdb: true
            msgpackr-extract: true
            prisma: true
            unrs-resolver: true
          EOF
          cat > package.json <<'EOF'
          { "name": "mf-ci-root", "version": "0.0.0", "private": true, "packageManager": "pnpm@11.24.0" }
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        working-directory: user
        run: pnpm lint

      - name: Typecheck
        working-directory: user
        run: pnpm typecheck

      - name: Test
        working-directory: user
        run: pnpm test

      - name: Build
        working-directory: user
        run: pnpm build
